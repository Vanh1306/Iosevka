name: Custom Build Font

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ttfautohint
          npm install

      - name: Build font
        # LƯU Ý: Nếu tên plan trong file .toml của bạn không phải là iosevka-custom, 
        # hãy thay 'iosevka-custom' bằng đúng tên plan của bạn (ví dụ: contents::myfont)
        run: npm run build -- contents::iosevka-custom

      - name: Upload Font Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Iosevka-Custom
          path: dist/
